{% load static %}
<!DOCTYPE html>
<html lang="ru" class="{% if theme_mode == 'dark' %}dark{% endif %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Доступ ограничен</title>
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
    <script src="{% static 'js/tailwindcss.js' %}"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-xl max-w-md w-full text-center border border-slate-200 dark:border-slate-700">
        <div class="text-6xl mb-4">🔒</div>
        <h1 class="text-2xl font-bold mb-2">Доступ ограничен</h1>
        <p class="text-slate-600 dark:text-slate-300 mb-6 text-sm">
            {{ message|default:"У вас нет прав для просмотра этой страницы." }}
        </p>
        <a href="{% url 'show_works_day' %}" class="inline-flex items-center gap-2 px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-lg transition-colors shadow">
            ← Вернуться к табелю
        </a>
    </div>
</body>
</html>
